company_name: Awesome Secrets Management
content_table: true
item_name: Item
items_name: Items
paging_mode: paging
copyright_year: 2026
name: Awesome Secrets Management
initial_prompt: >-
  A curated directory of secrets managers, key vaults and secret-scanning tools.
  Include products such as HashiCorp Vault, OpenBao, Infisical, Doppler,
  1Password Secrets Automation, AWS Secrets Manager, Azure Key Vault, Google
  Secret Manager, Akeyless, Bitwarden Secrets Manager, GitGuardian, Gitleaks,
  plus other notable commercial and open-source options. Categories: Secrets
  Managers, Cloud Secret Stores & KMS, Open-Source Vaults, Secret Scanning,
  Kubernetes Secrets, Developer .env Tools. For every item capture the official
  website, a short factual description, pricing model (free, freemium, paid,
  open source), deployment (cloud or self-hosted), key features and
  integrations.


  Initial categories: Secrets Managers; Cloud Secret Stores & KMS; Open-Source
  Vaults; Secret Scanning; Kubernetes Secrets; Developer .env Tools.

  Target keywords: secrets management, secrets manager, vault alternatives,
  secret scanning.


  Start with these source lists (use the raw README link for GitHub lists):

  - https://openalternative.co/categories/security-privacy/secrets-management

  - https://www.softwaresuggest.com/key-management-software

  - https://github.com/topics/secrets-management

  - https://github.com/topics/secret-scanning


  Inclusion rules: every item is a real product, service, open-source project or
  platform in scope; never a statistic, quote, blog post, person or general
  concept.

  One item per product. The item URL is the official website (never an affiliate
  link, review-site page or "top 10" article). Skip discontinued products and
  sites that no longer resolve.

  Descriptions: 2-4 factual sentences, no hype; state the pricing model; for
  open source state the license and link the repository.

  Each item gets exactly one primary category from the initial categories; do
  not create near-duplicate categories.

  Tags where they apply: Open Source, Self-Hosted, Free Plan, Freemium, Paid,
  Enterprise, API, AI-Powered, plus niche-specific ones.

  Never use G2, Capterra, GetApp, TrustRadius, AlternativeTo, Product Hunt,
  SourceForge/Slashdot, There's An AI For That or Toolify as sources.
website_repo: ever-works/awesome-secrets-management-website
company_website: https://secrets-management.ever.works
