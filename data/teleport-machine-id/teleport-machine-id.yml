name: Teleport Machine ID
description: Teleport Machine ID eliminates static credentials instead of
  storing them securely. Each CI/CD job or workload receives a short-lived X.509
  certificate or JWT-SVID (SPIFFE-compatible) at runtime that expires
  automatically when the job completes. Native integrations cover GitHub
  Actions, GitLab CI, CircleCI, Jenkins, Azure DevOps, and Spacelift. For cloud
  authentication, workloads use short-lived JWTs to authenticate to AWS, GCP,
  and Azure without static credentials.
