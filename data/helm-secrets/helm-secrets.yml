name: helm-secrets
description: helm-secrets is an open-source Helm plugin that helps manage
  secrets with a Git workflow and store them anywhere. It encrypts secrets using
  sops or age so they can be safely committed to version control and decrypted
  at deploy time. Licensed under Apache 2.0.
source_url: https://github.com/zendesk/helm-secrets
category: Kubernetes Secrets
tags:
