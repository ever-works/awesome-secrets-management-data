name: shhgit
description: shhgit is an open-source secrets detection tool that finds secrets
  and passwords in GitHub, GitLab, and Bitbucket repositories. It scans commit
  history and file contents to detect hardcoded credentials before they are
  exposed. Licensed under MIT.
source_url: https://github.com/eth0izzle/shhgit
category: Secret Scanning
