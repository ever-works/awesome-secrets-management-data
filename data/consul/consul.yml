name: Consul
description: Consul is an open-source service networking and key-value store
  from HashiCorp used for service discovery, configuration, and secrets
  management in microservices environments. It includes a Consul key-value
  store, Consul Connect service mesh, and Consul DNS to support splitting
  monoliths and containerization. Consul is released under the Mozilla Public
  License 2.0 and can be self-hosted or used via HashiCorp Cloud Platform (HCP)
  Consul.
