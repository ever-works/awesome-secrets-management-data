markdown: >-
  ## Overview


  Consul is an open-source service networking solution from HashiCorp that
  provides service discovery, configuration, and orchestration for modern,
  distributed applications. It includes a distributed key-value store for
  dynamic configuration and feature flagging, Consul Connect for zero-trust
  service mesh, and Consul DNS for service discovery.


  ## Key Features


  - Consul key-value store for hierarchical configuration and secrets

  - Consul Connect service mesh with mTLS encryption between services

  - Consul DNS and HTTP API for service discovery

  - Health checking and failure detection

  - Multi-datacenter replication and federation

  - Sentinel policy enforcement (HCP Consul)

  - Automated TLS certificate management via Consul Connect CA


  ## Deployment


  Consul can be self-hosted on-premises or in any cloud, or consumed as a fully
  managed service via HashiCorp Cloud Platform (HCP) Consul.


  ## Pricing


  Consul open source is free under the Mozilla Public License 2.0. HCP Consul
  offers a free tier and paid tiers based on usage and features.


  ## Repository


  https://github.com/hashicorp/consul
